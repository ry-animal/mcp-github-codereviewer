services:
  gh-review:
    build: .
    image: mcp-gh-reviewer:latest
    environment:
      - GITHUB_MODE=github.com
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - REVIEW_MODEL=anthropic/claude-sonnet-4
    env_file:
      - .env
    # Override command when running
    # Example: docker-compose run gh-review https://github.com/owner/repo/pull/123
